name: Build Nimbus OS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nimbus-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and boot-test the ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make room on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build and test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            qemu-system-x86 qemu-utils ovmf python3-pil

      - name: Let virtual machines use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "No KVM on this runner: tests will be slow"

      - name: Build the ISO
        run: |
          set -o pipefail
          mkdir -p out/ci
          sudo NIMBUS_VERSION=0.1 ./build.sh 2>&1 | tee out/ci/build.log

      - name: Boot-test the ISO
        run: |
          set -o pipefail
          ./os/test-boot.sh out/nimbus-os-*-amd64.iso out/ci 2>&1 | tee out/ci/test.log

      - name: Save test results to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p out/ci
          cd out/ci
          echo "$GITHUB_SHA" > commit.txt
          echo "$STATUS" > job-status.txt
          [ -f summary.md ] && cat summary.md >> "$GITHUB_STEP_SUMMARY" || true
          git init -q -b ci-results
          git config user.name "nimbus-ci"
          git config user.email "nimbus-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Test results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish the ISO as the latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat out/ci/summary.md
            echo
            echo "Screenshots from the test run are in the [ci-results branch](https://github.com/${GITHUB_REPOSITORY}/tree/ci-results)."
          } > out/release-notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/nimbus-os-*-amd64.iso out/nimbus-os-*-amd64.iso.sha256 \
            --title "Nimbus OS 0.1 (latest build)" --notes-file out/release-notes.md --prerelease --target "$GITHUB_SHA"
