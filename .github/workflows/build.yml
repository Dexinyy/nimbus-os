name: Build Nimbus OS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "wm/test-headless.sh", ".github/workflows/wm.yml", "shell/test/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Boot-test only these machines, e.g. 'update store' (empty: all of them). Doesn't publish."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nimbus-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and boot-test the ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 50  # the update package lists recent changes ("What's new" in Settings > Nimbus Update)

      - name: Make room on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Test the terminal emulator, the network, storage and update helpers
        run: |
          python3 os/test-term.py
          python3 os/test-net.py
          python3 os/test-storage.py
          python3 os/test-update.py

      - name: Install build and test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            qemu-system-x86 qemu-utils ovmf python3-pil

      - name: Let virtual machines use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "No KVM on this runner: tests will be slow"

      - name: Reuse Ubuntu packages downloaded by earlier builds
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ubuntu-packages-${{ github.run_id }}
          restore-keys: ubuntu-packages-

      - name: Build the ISO
        run: |
          set -o pipefail
          mkdir -p out/ci
          # The runner's own nearby Ubuntu mirror; the finished image points at the public servers.
          sudo NIMBUS_VERSION=0.1 UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu \
            UBUNTU_SECURITY_MIRROR=http://azure.archive.ubuntu.com/ubuntu APT_CACHE="$PWD/cache" \
            ./build.sh 2>&1 | tee out/ci/build.log

      - name: Keep the downloaded packages for the next build
        if: always() && hashFiles('cache/apt/*.deb') != ''
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ubuntu-packages-${{ github.run_id }}

      - name: Report the ISO layout and the live boot scripts
        if: success()
        run: |
          {
            echo "== partition table"; sudo sfdisk -d out/nimbus-os-*-amd64.iso || true
            echo; echo "== xorriso system area"; xorriso -indev out/nimbus-os-*-amd64.iso -report_system_area plain 2>&1 | tail -40 || true
            echo; echo "== casper persistence"; sudo grep -n -i "persisten\|casper-rw\|writable\|cow" build/chroot/usr/share/initramfs-tools/scripts/casper | head -80 || true
          } > out/ci/iso-report.txt 2>&1
          sudo tar -C build/chroot/usr/share/initramfs-tools -czf out/ci/casper-scripts.tar.gz scripts/casper scripts/casper-helpers scripts/casper-functions scripts/casper-bottom 2>/dev/null || true
          sudo chown -R "$(id -u)" out/ci

      - name: Boot-test the ISO
        env:
          NIMBUS_ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          ./os/test-boot.sh out/nimbus-os-*-amd64.iso out/ci 2>&1 | tee out/ci/test.log

      - name: Save test results to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p out/ci
          cd out/ci
          echo "$GITHUB_SHA" > commit.txt
          echo "$STATUS" > job-status.txt
          [ -f summary.md ] && cat summary.md >> "$GITHUB_STEP_SUMMARY" || true
          git init -q -b ci-results
          git config user.name "nimbus-ci"
          git config user.email "nimbus-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Test results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish the ISO and the update as the latest release
        if: success() && github.ref == 'refs/heads/main' && !inputs.only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Your own desktop OS. Download **nimbus-os-0.1-amd64.iso** below and start it in VirtualBox,"
            echo "or write it to a USB stick with balenaEtcher or Rufus (DD mode) and boot your PC from it with Secure Boot off."
            echo "Nothing is installed: it runs from the stick and your drive isn't touched."
            echo "Step-by-step instructions are in the [README](https://github.com/${GITHUB_REPOSITORY}#try-it)."
            echo
            echo "**Already running Nimbus OS with saving on?** If Settings > Nimbus Update offers **Download & install**, use that"
            echo "instead of the ISO: it downloads only Nimbus's own files (nimbus-os-update-*.tar.xz below, about"
            echo "$(python3 -c 'import glob, os; print("%.1f" % (os.path.getsize(glob.glob("out/nimbus-os-update-*.tar.xz")[0]) / 1e6))') MB),"
            echo "keeps your files, apps and settings, and a restart finishes the update."
            echo
            echo "Built from commit ${GITHUB_SHA::7}."
            echo
            cat out/ci/summary.md
            echo
            echo "Screenshots from the test run are in the [ci-results branch](https://github.com/${GITHUB_REPOSITORY}/tree/ci-results)."
          } > out/release-notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/nimbus-os-*-amd64.iso out/nimbus-os-*-amd64.iso.sha256 \
            out/nimbus-os-update.json out/nimbus-os-update-*.tar.xz \
            --title "Nimbus OS 0.1 (latest build)" --notes-file out/release-notes.md --prerelease --target "$GITHUB_SHA"
