# Nimbus OS boot menu
set default=0
set timeout=3
set timeout_style=menu

insmod all_video
insmod gfxterm
if loadfont unicode; then
  set gfxmode=auto
  terminal_output gfxterm
fi
set gfxpayload=keep
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

menuentry "Start Nimbus OS" {
  linux /casper/vmlinuz boot=casper noprompt quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 ---
  initrd /casper/initrd
}
menuentry "Start Nimbus OS with basic graphics" {
  linux /casper/vmlinuz boot=casper noprompt nomodeset quiet loglevel=3 ---
  initrd /casper/initrd
}
menuentry "Start Nimbus OS and show startup messages" {
  linux /casper/vmlinuz boot=casper noprompt systemd.show_status=1 ---
  initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "Open firmware settings" {
    fwsetup
  }
fi
