<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Nimbus OS looks like Windows 11: Selawik, Microsoft's open-source stand-in for Segoe UI, is the interface
     font, and pages or programs that ask for Segoe UI get it too. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable Text</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable Display</family><accept><family>Selawik</family></accept></alias>
  <alias><family>sans-serif</family><prefer><family>Selawik</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Selawik</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
