# Nimbus OS: in a virtual machine (VirtualBox, VMware, QEMU, Hyper-V) the virtual sound card takes sound in
# bigger, less punctual chunks than real hardware. PipeWire's own defaults already allow for that a little;
# give it more room, so sound doesn't run dry and crackle. These apply only inside a virtual machine.
context.properties = {
    vm.overrides = {
        default.clock.min-quantum = 1024
        default.clock.quantum     = 2048
    }
}
