# Apps from the Store (Flatpak), Steam's game containers (pressure-vessel) and browsers build their sandboxes with
# unprivileged user namespaces. Ubuntu 24.04 limits those to programs an AppArmor profile allows; Nimbus allows
# them for every program, as Fedora, Debian and Arch Linux do.
kernel.apparmor_restrict_unprivileged_userns = 0
